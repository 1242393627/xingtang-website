# ============ IP 直连 / 未绑定域名 → 301 跳转正式域名（防 IP 收录与镜像站） ============
# http 访问 IP：精确匹配 IP 的 Host → 跳转（其余未绑定 Host 仍由 BT 0.default 兜底）
server {
    listen 80;
    listen [::]:80;
    server_name 43.156.13.57;
    return 301 https://shop.ywye.top$request_uri;
}

# https 访问 IP 或任何未绑定域名（_ 兜底）→ 全部 301 到正式域名
# 注意：使用同域名证书保证 TLS 握手可完成（浏览器会提示证书不匹配，但 301 正常发出）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 43.156.13.57 _;
    ssl_certificate    /etc/tencent-ssl/shop.ywye.top/fullchain.pem;
    ssl_certificate_key /etc/tencent-ssl/shop.ywye.top/privkey.pem;
    return 301 https://shop.ywye.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.ywye.top;
    # 强制 HTTPS
    return 301 https://$host$request_uri;
}

# www 规范化：待 DNS 解析 www 后自动生效（避免重复内容）
server {
    listen 80;
    listen [::]:80;
    server_name www.shop.ywye.top;
    return 301 https://shop.ywye.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.ywye.top;
    index index.html index.htm;
    root /www/server/nginx/html/article;

    ssl_certificate    /etc/tencent-ssl/shop.ywye.top/fullchain.pem;
    ssl_certificate_key /etc/tencent-ssl/shop.ywye.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 隐藏 nginx 版本号（防信息泄露）
    server_tokens off;

    # gzip 压缩 HTML/JS/CSS/JSON
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;

    # 安全响应头（always 覆盖错误页）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://lf1-cdn-tos.bytegoofy.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # CMS 管理后台：basic auth 防未授权访问（API 另有 token 鉴权）
    location /admin {
        auth_basic "XingTang Admin";
        auth_basic_user_file /www/server/nginx/.htpasswd_xingtang;
        index index.html;
    }

    # CMS API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }

    # 资讯详情页 SSR
    location /news/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 网站地图（CMS 动态生成，随发布自动更新 lastmod）
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 内容文件
    location /content/ { }

    # 静态资源缓存
    location ~ \.(gif|jpg|jpeg|png|bmp|swf|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        error_log /dev/null;
        access_log /dev/null;
    }
    location ~ \.(js|css)?$ {
        expires 12h;
        add_header Cache-Control "public";
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/shop.ywye.top.log;
    error_log   /www/wwwlogs/shop.ywye.top.error.log;
}
